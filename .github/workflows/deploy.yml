name: Deploy to cPanel
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Test SSH connection
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" "echo connected && which rsync"
            
      - name: Deploy via SSH (rsync + password)
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avzr --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='.git*/**' \
            --exclude='node_modules/**' \
            --exclude='.github/**' \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}"
